<!doctype html>
<html lang="en" class="overflow-x-hidden max-w-full">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LabSync - Campus Laboratory Resource-Sharing Platform with GenAI Conflict Resolution" />
    <title>LabSync — GenAI Campus Lab Resource Sharing</title>
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('labsync-theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased font-sans min-h-screen overflow-x-hidden max-w-full">
    <div id="root" class="overflow-x-hidden max-w-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
